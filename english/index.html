<html lang="en">
<head>
  <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeakSlab</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="icon" type="image/png" sizes="32x32" href="/peak32x32.png" />
	<link rel="icon" type="image/png" sizes="192x192" href="/peak192x192.png" />
	<link rel="icon" type="image/png" sizes="512x512" href="/peak512x512.png" />
	<link rel="icon" type="image/svg" sizes="any" href="/peakslab.svg" />
	<link rel="manifest" id="link" href="manifest.json">
	<meta name="theme-color" content="#000000" />
	<meta name="apple-mobile-web-app-title" content="PeakSlab" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<script src="./config.js"></script>
</head>
<body>
	<header id="header">
  <div id="searchContainer">
		<div class="logo"><img src="/peakslab.svg" alt="PeakSlab"><div class="logooverlay" id="appname"></div></div>
    <input type="text" id="queryInput" value="" placeholder="Type your query here..." autofocus autocomplete="off" onchange="startSearch();">
  </div>
	<div id="tabs" class="hide"></div>
</header>

	<div id="content">
		<div id="loadProgress"></div>
		<div id="status">Status: Ready</div>
		<div id="results"></div>
	</div>

<div id="controls">
				<button class="control-btn" id="install-button">Install App</button>
        <button class="control-btn" id="fontDecrease" title="Decrease font size">−</button>
        <button class="control-btn" id="fontIncrease" title="Increase font size">+</button>
        <button class="control-btn" id="settingsBtn" title="Diagnostics & Settings">⚙</button>
    </div>

    <div id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings & Diagnostics</h2>
                <button class="close-btn">×</button>
            </div>
            <div id="diagnostics">
		<div id="timing"></div>
</div>
            <label><input type="checkbox" id="reverse"> Reverse order</label><br>
            <button class="setting" id="showtabs">Toggle tabs</button>
            <button class="setting" id="darkModeToggle">Toggle Dark Mode</button>
            <button class="setting" id="debugToggle">Toggle Debug</button>
            <button class="setting" id="uninstall">Uninstall Service Worker</button>
        </div>
    </div>
    <div id="popupOverlay">
        <div id="popupContent">
            <div id="popupHeader">
                <span id="popupTitle">Search: <span id="popupQuery"></span></span>
                <button id="popupClose" class="close-btn">×</button>
            </div>
            <div id="popupResults"></div>
        </div>
    </div>

    <div id="ios-instructions">
        <p>To install this app on your iPhone or iPad:</p>
        <ol>
            <li>Tap the <strong>Share</strong> button in Safari.</li>
            <li>Scroll down and select <strong>Add to Home Screen</strong>.</li>
            <li>Follow the on-screen instructions.</li>
        </ol>
        <button id="ios-close-btn">
            Got it
        </button>
    </div>

<script src="/app.js"></script>
</body>
</html>
