      background-color: #0056b3;
    }

        body {

header {
  background: #DDB;

  top: 0;
  left: 0;

  width: 100%;

  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);

header.scroll-up{

header.static{
    position: absolute;

header.scroll-down{

      .tbug {
        background: #ffcccc;

      .dropd-content {
        display: none;
        position: absolute;
        background-color: #e9d9a9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        padding: 12px 16px;
        z-index: 5;
      }

      .dropd:hover .dropd-content {
        display: block;
      }

      .dropd:active .dropd-content {
        display: block;
      }

      li:only-child{
	list-style-type: none;
      }

      p-d, .entry {
	display: block;
        background-color: white;
        border: 2px dashed #deeede;
        border-radius: 5px;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.3);
        margin-bottom: 0.5em;
        padding: 0.5em;
      }

      .hent, p-d h1, p-d h2, p-d h3 {
        margin-bottom: 0px;
        margin-top: 0px;
        color: #004400;
      }

      .hentu {
        margin-bottom: 0px;
        margin-top: 0px;
        color: #004400;
        border-bottom: 2px dashed #aaaa99;
        display: inline;
      }

      #logo {
        position: relative;
        z-index: -100;
        font-family: serif;
        font-size: 150%;
      }

      #load {
        position: absolute;
        z-index: 6;
        margin-left: 5em;
        margin-top: 10em;
        border: 30px solid #d3f3a3;
        /* Light grey */
        border-top: 30px solid #1dda50;
        /* Blue */
        border-radius: 50%;
        display: inline-block;
        width: 200px;
        height: 200px;
        animation: spin 2s linear infinite;
	z-index: 100;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      #tout {
        clear: left;
      }

      #q,
      #searchbutton,
      #qcol,
      #qsort {
        background: #f1f1f1;
        margin: 0;
        padding: 0;
        border: 0;
        font-size: 100%;
        font: inherit;
        vertical-align: baseline;
        padding: 10px;
        border: 1px solid grey;
        font-size: 17px;
      }

      #q {
        background: #f1f1f1;
        border-right: none;
        border-left: none;
        border-radius: 15px 15px 15px 15px;
        padding-left: 4em;
        padding-right: 5.6em;

        z-index: 1;
        width: 100%;
      }

      #q:hover {
        box-shadow: 0 0px 4px var(--color-primary);

      #qcol {

        position: relative;

        margin-left: -4em;

        cursor: pointer;
        width: 4em;

      }

      #searchbutton:hover {
        background: #88aa00;

      <script>
	const tbug =  document.getElementById("tbug");
        const synth = window.speechSynthesis;
        let voices = [];

	const header = document.querySelector("header");
	const main = document.querySelector("main");
	const headerHeight = document.querySelector("header").offsetHeight + 50;

// Function to create CSS classes based on available voices
function updateLanguageStyles() {
    const availableLangs = new Set(voices.map(voice => voice.lang.toLowerCase()));

    const styleElement = document.createElement('style');
    styleElement.type = 'text/css';

    // Default rule: hide all lang- prefixed classes
    let css = '[class^="lang-"] { display: none; }\n';

    availableLangs.forEach(lang => {
        css += `.lang-${lang.substr(0,2)} { display: inline; }\n`;
    });

    styleElement.textContent = css;

    const existingStyle = document.getElementById('lang-styles');
    if (existingStyle) {
        existingStyle.remove();
    }
    styleElement.id = 'lang-styles';

    document.head.appendChild(styleElement);
}

        function populateVoiceList() {
            voices = synth.getVoices();
	    updateLanguageStyles();
	    tbug.innerHTML+="🗣️";
        }

        // Populate voices when they're loaded
        synth.onvoiceschanged = populateVoiceList;
        populateVoiceList();

        function speak(text, lang) {
            if (synth.speaking) {
                synth.cancel();
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = voices.find(voice => voice.lang.includes(lang.substr(0, 2)));
	    if(!utterance.voice)
		alert(lang + ' language not supported');
	    else{
            utterance.lang = lang;
            utterance.pitch = 1;
            utterance.rate = 0.5;
            utterance.volume = 1;

            synth.speak(utterance);
	 }
        }

        const tsel = document.getElementById("tablesel");
        const qcol = document.getElementById("qcol");
        const limitd = document.getElementById("limitd");
        const limit = document.getElementById("limit");
        const tout = document.getElementById("tout");
        const tresults = document.getElementById("tresults");
        const urlParams = new URL(globalThis.location.href).searchParams;
          const logo = document.getElementById("logo");
          logo.innerHTML = document.title + logo.innerHTML;
          const q = document.getElementById("q");

    let ssearchButton = null;

    // Function to remove the search button
    function removeSsearchButton() {
      if(ssearchButton){
        ssearchButton.remove();
	ssearchButton = null;
      }
    }

    // Function to create and position the search button
    function showSsearchButton(selection) {
      removeSsearchButton();

      // Create the search button
      ssearchButton = document.createElement('button');
      ssearchButton.id = 'ssearch';
      ssearchButton.innerText = 'Search';
      document.body.appendChild(ssearchButton);

      // Get the selected text
      const selectedText = selection.toString().trim();
      if (!selectedText) return;

      // Get the range of the selection
      const range = selection.getRangeAt(0);
      const rect = range.getBoundingClientRect();

      // Position the button at the bottom-right of the selection
      ssearchButton.style.top = `${window.scrollY + rect.bottom + 30}px`;
      ssearchButton.style.left = `${window.scrollX + rect.left}px`;

      // Add click event to trigger a search
      ssearchButton.addEventListener('click', () => {
	      removeSsearchButton();
	      q.value = selectedText;
	      tSearch(0);
      });
    }

	  // Add a single click event listener to the document
        document.addEventListener("click", function(event) {
            // Check if the clicked element is a <p-a> tag
            if (event.target.tagName.toLowerCase() === "p-a") {
                q.value = event.target.textContent; // Get the content (e.g., "arg1")
		tSearch(0);
            }
        });

    // Listen for selection changes
    document.addEventListener('selectionchange', () => {
      const selection = window.getSelection();
      if (selection.toString().trim()) {
        showSsearchButton(selection);
      } else {
        removeSsearchButton();
      }
    });
          q.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
              event.preventDefault();
              tSearch(0);
            }
          });
          q.value = urlParams.get('q');
          var desc = false;
          var tToggleDesc = function(div) {
            desc = !desc;
            if (desc) {
              div.innerHTML = "A↓";
            } else {
              div.innerHTML = "A↑";
            }
            tSearch(0);
          };
          var trestotal = 0;
          var fullsearch = 0;
          limit.oninput = function() {
            limitd.innerHTML = this.value;
          };
          const tlist = [];
          const bcheck = document.getElementById("bcheck");
          const echeck = document.getElementById("echeck");
          const dcol = document.getElementById("dcol");
          tbug.innerHTML += urlParams;
          const w = new Worker(
            "dict.js" // + urlParams
            /* Note the URL argument on that name. See
            the notes in demo-123.js (search for
            "importScripts") for why we need
            that. */
          );
          w.postMessage("param: " + "db=lozi.db.html&dbass=");
          (function() {
            var color = false;
            const logHtml = function(cssClass, ...args) {
              if (cssClass == "entry") {
                const ln = document.createElement("div");
                ln.classList.add("entry");
                ln.innerHTML = args;
                // ln.append(document.createTextNode(args.join(' ')));
                tout.append(ln);
                color = !color;
              } else if (cssClass == "results") {
                trestotal += args;
                tresults.innerHTML += (args == '0' ? '<span class="bd-error">' : '<span class="bd-success">') + args + "; </span>";
                if (fullsearch == 0 && trestotal == 0) {
                  tSearch(1);
                }
              } else if (cssClass == "refresh") {
                tInit();
              } else if (cssClass == "init") {
                if (args == "*ALL") {
                  qcol.innerHTML += '<option style="background: yellow; font-size: 125%" value="' + args + '">' + args + "</option>";
                  let lo = document.getElementById("load");
                  if (lo) {
                    lo.remove();
                    if (q.value != "") {
                      tSearch(0);
                    }
                  }
                } else {
                  qcol.innerHTML += '<option value="' + args + '">' + args + "</option>";
                  dcol.innerHTML += '<input type="checkbox" value="' + args + '" checked><label>' + args + "</label><br>";
                }
              } else if (cssClass == "init2") {
                tlist[tlist.length - 1].col.push(args);
              } else if (cssClass == "dictlist") {
                tlist.push({
                  name: args,
                  col: []
                })
                tsel.innerHTML += '<option value="' + args + '">' + args + "</option>";
              } else if (cssClass == "audio") {
                (async () => {
                  const blob = new Blob([args[1]], {
                    type: 'audio/webm; codecs=opus'
                  })
                  const audio = document.getElementById(args[0]).firstChild;
                  audio.src = URL.createObjectURL(blob);
                  audio.controls = true;
                  audio.autoplay = true;
                })()
              } else {
                const ln = document.createElement("div");
                if (cssClass) ln.classList.add(cssClass);
                ln.append(document.createTextNode(args.join(" ")));
                document.getElementById("tbug").append(ln);
                if (cssClass == "bd-error") {
                  let lo = document.getElementById("load");
                  if (lo) {
                    lo.remove();
                  }
                }
              }
            };
            w.onmessage = function({
              data
            }) {
              console.log("MAIN: Message received from worker");
              switch (data.type) {
                case "log":
                  logHtml(data.payload.cssClass, ...data.payload.args);
                  break;
                default:
                  logHtml("bg-error", "Unhandled message:", data.type);
              }
            };
          })();
          var tAudio = function(button) {
            console.log("MAIN: request audio message sent to worker");
	    const mom = button.parentNode;
	    mom.innerHTML = "";
	    const audio = document.createElement("audio");
	    mom.append(audio);
            w.postMessage(".addmedia: " + mom.id + "@" + mom.id);
	    audio.addEventListener("canplay", () => {
                audio.play().catch(error => {
                    console.log("Error playing audio:", error);
                });
            });
          };
          var tInit = function() {
            console.log("MAIN: init message sent to worker");
            dcol.innerHTML = qcol.innerHTML = "";
            if (tlist.length > 0) {
              const foundIdx = tlist.findIndex(el => el.name == tsel.value);
              const temp = tlist[foundIdx];
              tlist.splice(foundIdx, 1);
              tlist.unshift(temp);
              tsel.innerHTML = "";
              tlist.forEach(tl => tsel.innerHTML += '<option value="' + tl.name + '">' + tl.name + "</option>");
            }
            w.postMessage(".init: " + tsel.value);
          };
	  let lastScroll = 0;
          var tSearch = function(all) {
            urlParams.set('q', q.value);
            window.history.pushState({
              "html": "",
              "pageTitle": window.title
            }, "", "?" + urlParams);
	    //window.pageYOffset = 0;
	    header.classList.remove("scroll-up");
	    header.classList.remove("scroll-down");
	    document.pageYOffset = 0;
	    lastScroll = 0;
	    document.activeElement.blur();

            console.log("MAIN: Message posted to worker");
            const q2 = q.value.replaceAll(/[']+/g, "‘")
            tout.innerHTML = "";
            tresults.innerHTML = (qcol.value != "*ALL" && all) ? 'Exact Search: <span class="bd-error">0;</span> Wide Search: ' : "Exact Search: ";
            trestotal = 0;
            fullsearch = all;
            if (all == 0 && qcol.value != "*ALL") {
              const dlist = [];
              dcol.childNodes.forEach(function(node) {
                if (node.tagName == "INPUT" && node.checked) {
                  dlist.push(node.value);
                }
              });
              const dres = dlist.filter((x) => typeof x === "string" && x.length > 0).join(", ");
              w.postMessage(
                "SELECT " +
                dres +
                " FROM " +
                tsel.value +
                " WHERE " +
                qcol.value +
                " LIKE " +
                (!bcheck.checked ? "'%" : "'") +
                q2 +
                (!echeck.checked ? "%'" : "'") +
                " order by " +
                qcol.value +
                (desc ? " desc" : " asc") +
                " limit " +
                limit.value +
                ";"
              );
            } else {
              tlist.forEach(function tcallall(ctab) {
                /*	for (let i = 0; i < ctab.col.length; i++) {
                let ccol = ctab.col[i]; */
                let ccol = ctab.col.join(" LIKE '%" + q2 + "%' OR ") + " LIKE '%" + q2 + "%'";
                w.postMessage("SELECT " + ctab.col.join(", ") + " FROM " + ctab.name + " WHERE " + ccol + " order by " + ((ctab.name == tsel.value && qcol.value != "*ALL") ? qcol.value : ctab.col[0]) + (desc ? " desc" : " asc") + " limit " + limit.value + ";");
              });
            }
          };
          const registerServiceWorker = async () => {
            if ("serviceWorker" in navigator) {
              try {
                const registration = await navigator.serviceWorker.register("dictsw.js", {});
                if (registration.installing) {
                  console.log("Service worker installing");
                } else if (registration.waiting) {
                  console.log("Service worker installed");
                } else if (registration.active) {
                  console.log("Service worker active");
                }
              } catch (error) {
                console.error(`Registration failed with ${error}`);
              }
            }
          };
          registerServiceWorker();
          var tRemoveServiceWorker = function() {
            console.log("Trying to uninstall Service Worker");
            if (window.navigator && navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                  registration.unregister();
                  console.log("Uninstalled Service Worker");
                }
              });
            }
          };

main.style.paddingTop = headerHeight + "px";
window.addEventListener("scroll", () => {
  let currentScroll = window.pageYOffset;
  if ((currentScroll - lastScroll > 0) && document.activeElement != q) {
    header.classList.add("scroll-down");
    header.classList.remove("scroll-up");
  } else {
    // scrolled up -- header show
    header.classList.add("scroll-up");
    header.classList.remove("scroll-down");
  }
if(Math.abs(lastScroll - currentScroll) > 90)
	  lastScroll = currentScroll;
})

      </script>

    <button id="install-button">
        Install App
    </button>

    <!-- iOS Instructions -->
    <div id="ios-instructions">
        <p>To install this app on your iPhone or iPad:</p>
        <ol>
            <li>Tap the <strong>Share</strong> button in Safari.</li>
            <li>Scroll down and select <strong>Add to Home Screen</strong>.</li>
            <li>Follow the on-screen instructions.</li>
        </ol>
        <button id="ios-close-btn">
            Got it
        </button>
    </div>
    <script>
        let deferredPrompt;

        function isIOS() {
            return /iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

            document.getElementById('ios-close-btn').addEventListener('click', () => {
                iosInstructions.style.display = 'none';
            });
        const iosInstructions = document.getElementById('ios-instructions');
	if (isIOS() && window.navigator.standalone == false) {
            iosInstructions.style.display = 'none';
            document.getElementById('install-button').style.display = 'block';
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-button').style.display = 'block';
        });

        document.getElementById('install-button').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
            }
	    if(isIOS()){
		    iosInstructions.style.display = 'block';
	    }
        });

	if(window.navigator.standalone){
            document.getElementById('install-button').style.display = 'none';
	}

        window.addEventListener('appinstalled', () => {
            console.log('PWA installed');
            document.getElementById('install-button').style.display = 'none';
        });
    </script>
