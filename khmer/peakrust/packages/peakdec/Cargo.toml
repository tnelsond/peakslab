[package]
name = "peakdec"
version = "0.4.2"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3.69"
zstd = { version = "0.13", default-features = false, features = ["wasm"] }
alphanumeric-sort = "1.5"
#peakcmp = { path = "../peakcmp"}

[profile.release]
opt-level = "z"          # Optimize for size
lto = true               # Link Time Optimization
codegen-units = 1        # Better optimization
panic = "abort"          # Reduces panic code
strip = "symbols"        # Remove debug symbols

# WASM-pack specific settings
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-mutable-globals"]
