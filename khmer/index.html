<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khmer Dictionary Search</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="peak32x32.png">
    <link rel="manifest" id="link" href="manifest.json">
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="PeakSlab Khmer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
    <!-- Fixed Header -->
    <header id="header">
        <div id="searchContainer">
            <div class="logo">
                <img src="peakslab.svg" alt="PeakSlab">
                <div class="logooverlay">kh</div>
            </div>
            <input type="text" id="searchInput" placeholder="Search dictionaries..." autofocus autocomplete="off">
        </div>
        <div id="tabs"></div>
    </header>

    <!-- Main Content -->
    <div id="content">
        <div id="options" style="padding: 10px 15px;">
        </div>
        <div id="loading">Initializing decoder and loading dictionaries...</div>
        <div id="results"></div>
        <div id="loader">Loading more...</div>
    </div>

    <!-- Floating Controls -->
    <div id="controls">
        <button class="control-btn" id="fontDecrease" title="Decrease font size">−</button>
        <button class="control-btn" id="fontIncrease" title="Increase font size">+</button>
        <button class="control-btn" id="settingsBtn" title="Diagnostics & Settings">⚙</button>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings & Diagnostics</h2>
                <button class="close-btn">×</button>
            </div>
            <div id="diagnostics"></div>
            <label><input type="checkbox" id="reverse"> Reverse order</label>
            <button id="darkModeToggle">Toggle Dark Mode</button>
            <button id="removeService" onclick="javascript:removeServiceWorker()">Uninstall Service Worker</button>
        </div>
    </div>

    <!-- Popup Overlay -->
    <div id="popupOverlay">
        <div id="popupContent">
            <div id="popupHeader">
                <span id="popupTitle">Search: <span id="popupQuery"></span></span>
                <button id="popupClose" class="close-btn">×</button>
            </div>
            <div id="popupResults"></div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
