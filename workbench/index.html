<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeakSlab Workbench</title>
<link rel="icon" type="image/svg" sizes="any" href="/peakslab.svg">
<meta name="theme-color" content="#664433">
<style>
@font-face { font-family: Battambang; src: url(/khmer/battambang.woff2) format("woff2"); unicode-range: U+1780-17FF, U+19E0-19FF, U+200B-200D, U+25CC; }
:root {
	--bg: #ba8; --card: #fff; --soft: #fdf8f0; --text: #1a1a1a; --muted: #6b5d48; --line: #e6dcc8;
	--header-bg: #643; --header-fg: #f3e6c8; --up: #2f7a17; --down: #a33; --mark: #fd5;
	--km: Battambang, "Khmer OS", "Noto Sans Khmer", serif;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
	--bg: #321; --card: #2a2420; --soft: #221c18; --text: #eee6da; --muted: #b8a88f; --line: #4a3f33;
	--header-bg: #211; --header-fg: #f3e6c8; --up: #5c3; --down: #f77; --mark: #8a7020;
	color-scheme: dark;
} }
:root[data-theme="dark"] {
	--bg: #321; --card: #2a2420; --soft: #221c18; --text: #eee6da; --muted: #b8a88f; --line: #4a3f33;
	--header-bg: #211; --header-fg: #f3e6c8; --up: #5c3; --down: #f77; --mark: #8a7020;
	color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif }
header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--header-bg); color: var(--header-fg) }
header b { margin-right: auto }
header button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #0003; background: var(--header-fg); color: #321; cursor: pointer }
main { max-width: 760px; margin: 0 auto; padding: 12px 16px 40px }
.card { background: var(--card); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--line) }
h1 { font: 2.2em/1.3 var(--km); margin: 0 }
.d { font-family: var(--km); white-space: normal; overflow-wrap: anywhere }
.d + .d { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px }
.lbl { font-size: .8em; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px }
.none { color: var(--muted); font-style: italic }
.sense { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line) }
.sense:first-of-type { border-top: 0 }
.sense .t { flex: 1 }
.sense .pos { color: var(--muted); font-style: italic; margin-right: 4px }
.sense .c { font-size: .8em; color: var(--muted); margin-left: 6px }
.sense.cur { background: var(--soft); outline: 2px solid var(--mark); border-radius: 6px; padding: 8px }
.v { font-size: 1.6em; width: 2.2em; height: 1.8em; border-radius: 8px; border: 2px solid var(--line); background: var(--soft); cursor: pointer; line-height: 1 }
.v.on.up { border-color: var(--up); background: color-mix(in srgb, var(--up) 25%, var(--card)) }
.v.on.down { border-color: var(--down); background: color-mix(in srgb, var(--down) 25%, var(--card)) }
nav { display: flex; gap: 8px; justify-content: space-between; align-items: center }
nav button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer }
.hint { color: var(--muted); font-size: .85em; text-align: center; margin-top: 10px }
</style>
</head>
<body>
<header><b>Workbench</b><span id="count"></span><button type="button" id="export">Export</button><button type="button" id="old" hidden>Export earlier work</button></header>
<main>
<nav class="card"><button type="button" id="prev">← Back</button><span id="where"></span><button type="button" id="next">Next →</button></nav>
<div id="word"></div>
<p class="hint">👍 Y or ↑ · 👎 N or ↓ · Enter or → next word · ← back. Votes stay in this browser; Export saves them.</p>
</main>
<script src="wb.js"></script>
</body>
</html>
